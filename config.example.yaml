# 运行模式
#   review      - 修复后生成 pending changelist 并回写 Tapd 评论，人工在 p4 里 review/submit（推荐默认）
#   auto        - 修复 + 测试通过后直接 p4 submit（高风险，显式开启）
#   dry-run     - 只读：仅列出待处理 bug，不做任何修改
mode: review

# 修复流程参数
poll_interval_min: 30          # 预留：外部定时任务用
max_bugs_per_run: 10           # 单轮最多处理数量
max_attempts: 1                # 单个 bug 自动重试次数（资源类改动不强制重试）
agent_timeout_s: 900           # 每个编码 Agent 调用的超时（秒）
llm_review: false              # 是否在生成 changelist 前用 LLM 复核 diff（额外一次 claude 调用）

# 过滤条件
filters:
  exclude_status: [resolved, closed, rejected]   # 不处理这些 Tapd 状态

# 优先级 -> 排序权重（数字越小越优先；未匹配到的排最后）
priority_weight:
  "1": 0
  "2": 1
  "3": 2
  "4": 3
  "高": 0
  "中": 1
  "低": 2

# 工作区（Tapd 项目）配置，可多个
workspaces:
  - workspace_id: "1152729922"      # Tapd workspace_id（用 API 返回的为准）
    owner: "your_tapd_login"        # 你的 Tapd 登录名，用于 current_owner 过滤"分配给我的"
    comment_status: resolved         # 修复后回写 Tapd 的状态（resolved=已解决·待提交）
    default_repo: "product"          # 默认仓库名（无法按模块匹配时使用）
    repos:                           # bug 所属仓库的本地路径（p4 workspace root）
      - name: "product"
        path: "C:\\repos\\product"   # 该目录需已配置好 p4 client 映射
        test_cmd: "pytest tests"     # 修复后运行的测试命令（留空则跳过）
        agent: claude                # 用哪个编码 Agent：claude / codex / command

# 编码 Agent 配置 —— 这里选的是【编码 Agent 的 CLI】，不是裸模型。
#   claude  = 调用 Claude CLI（claude -p ...）—— 完整保留编码 Agent 特性：自主编辑循环、工具调用、权限模式、上下文管理
#   codex   = 调用 Codex CLI（codex exec ...）
#   command = 任意自定义 Agent CLI（自定命令模板）
# 每个仓库用哪个，看 workspaces[].repos[].agent: claude | codex | command
# model 只是【可选】的模型覆盖：不填则用该 CLI 自身的默认模型，编码 Agent 特性与模型名无关。
agents:
  claude:
    model: ""                          # 可选：覆盖 CLI 用的模型（claude --model），例如 "claude-sonnet-5"；留空用 CLI 默认
    allowed_tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
    permission_mode: acceptEdits       # claude --permission-mode
  codex:
    # 对应命令: codex exec --dangerously-bypass-approvals-and-sandbox "<prompt>"
    approval: auto
  command:
    # 任意 Agent 的命令模板，{prompt} / {repo} 会被替换；shell=True 执行
    # 例如: "my-agent --repo {repo} --task \"{prompt}\""
    template: null

# Perforce（环境变量 P4PORT/P4CLIENT/P4USER/P4PASSWD 优先级更高，也可直接填这里）
p4:
  port: ssl:perforce.example.com:1666
  client: tapd-agent_yourname
  user: your_p4_user
  password: ""

# Web 管理台
web:
  host: 127.0.0.1
  port: 8080
  token: ""                # 留空则本机免鉴权；建议设置一个，管理页需带 token

# Tapd 后端
#   mcp  - 通过 Tapd MCP Server 接入（推荐）：只需个人访问令牌 TAPD_ACCESS_TOKEN，无需公司 API 账号权限、无需托管
#   rest - 直接用 Tapd OpenAPI（api_user/api_password，需 API 账号权限）
tapd:
  backend: mcp
  # ---- backend: mcp 时使用 ----
  access_token: ""        # 个人访问令牌（Tapd 个人设置 -> 个人访问令牌 创建）
  mcp:
    # 本地 stdio 模式（推荐，无需托管/URL）：
    transport: stdio
    command: "npx"                         # 用 Node 运行官方包（本机有 Node 即可）
    args: ["-y", "@xihe-lab/tapd-mcp-server"]
    # 若已装 Python 3.13+ 也可改用: command: "uvx" / args: ["mcp-server-tapd"]
    #
    # 可选：腾讯云托管模式（不开托管就用上面的 stdio）：
    # transport: streamable-http
    # url: "https://..."                  # 腾讯云 MCP 专属连接地址
    # token: ""                           # 远程鉴权（若地址未内嵌），也可用 env MCP_TOKEN
    # 工具名映射（默认即为官方 mcp-server-tapd 的真实工具名，一般无需改）
    tool_map:
      list_bugs: "tapd_get_bugs"
      get_bug: "tapd_get_bugs"
      update_bug: "tapd_update_bug"
      add_comment: "tapd_create_comment"   # 注意内容参数是 description
  # ---- backend: rest 时使用（可选）----
  api_user: ""
  api_password: ""
