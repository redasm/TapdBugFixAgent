# 注：web 管理台顶部的「⚙ 设置」可编辑 Pi 模型及 p4/tapd 配置，保存写入同目录 overrides.yaml
# （启动时合并、优先级最高），不必改本文件。本文件保留 workspaces / 优先级等复杂结构。

# 修复流程参数
max_bugs_per_run: 10           # 单轮最多处理数量
max_attempts: 2                # 单个 bug 自动重试次数：失败后自动回到队列重试（带上次失败证据），
                               # 重试耗尽才标记 failed 并回写 Tapd 失败评论。设为 1 = 不自动重试
agent_timeout_s: 1800          # 每个编码 Agent 调用的超时（秒）；超时后停止自动重试并转 needs_info

# Pi 直接连接网关，填写地址、API Key 和模型名称即可。
# 网关需支持 Anthropic Messages 协议；默认使用 Authorization: Bearer。
pi:
  provider:
    base_url: "https://gateway.example.com"
    api_key: ""                  # 填写网关 API Key；省略时读取 PI_API_KEY 环境变量
    model_id: "your-model"       # 填写网关支持的模型名称
    # context_window: 200000     # 可选，按实际模型能力配置
    # max_tokens: 32000          # 可选，最大 131072
  # skill_dirs: [".agents/skills"]  # 默认自动加载仓库中的共享 skill 目录

# MCP 注册表：所有 enabled server 会在每个 Agent 启动时自动加载；增加 MCP 只需追加配置。
# 本地服务使用 command / args / cwd / env，远程 Streamable HTTP 服务使用 url 及可选鉴权字段。
# 字符串支持 {repo}/${repo}（当前 Bug 仓库根）和 {agent}/${agent}（本工具安装目录）。
# enabled_tools / disabled_tools 控制可用工具范围；read_only_tools 是本项目的调查/评审白名单。
# automates_manual_keywords 同时声明资源门禁关键词；server 禁用时仍转人工，启用时才允许自动处理。
mcp_servers:
  # 读取 CrashSight / Sentry 等诊断页。连接模式由 CHROME_DEVTOOLS_MODE 选择：
  #   managed（推荐）＝由 MCP 自己启动一个持久独立 profile 的项目专用 Chrome，
  #     走管道连接，因此不经过 Chrome 的远程调试授权弹窗；首次需在该专用浏览器里登录一次。
  #   attach＝附着到你日常使用的 Chrome，复用已有登录态，但受 Chrome 144+
  #     chrome://inspect/#remote-debugging 的连接授权约束，连接断开后需重新授权。
  # 两种模式都不需要也不能用 --isolated（那是临时 profile，关闭即清）。
  chrome_devtools:
    enabled: false
    required: false
    command: node
    # 短生命周期 stdio 代理复用官方常驻 daemon，避免每个 Bug/阶段都建立新的 Chrome 调试连接。
    args: ['{agent}\\dist\\chromeDaemonProxy.js']
    cwd: '{agent}'
    env:
      CHROME_DEVTOOLS_MODE: managed
      # managed 专用 profile 目录；留空默认项目内 .chrome-profile（已 gitignore）。
      # CHROME_DEVTOOLS_PROFILE_DIR: ''
      # 可选：指定 Chrome 可执行文件（managed 专用）。
      # CHROME_DEVTOOLS_EXECUTABLE_PATH: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      # 单次 daemon 调用预算：必须早于下面的 tool_timeout_sec（90s）结束，
      # 否则外层超时先触发，只剩一条笼统的 MCP 超时，看不到真实原因。
      CHROME_DEVTOOLS_CALL_TIMEOUT_MS: '75000'
    enabled_tools: &chrome_read_tools
      - list_pages
      - new_page
      - close_page
      - navigate_page
      - take_snapshot
      - take_screenshot
      - list_console_messages
      - get_console_message
      - list_network_requests
      - get_network_request
    read_only_tools: *chrome_read_tools
    startup_timeout_sec: 60
    tool_timeout_sec: 90

  unreal_mcp:
    enabled: false
    required: false               # true 时启动失败会中止 Agent；false 时跳过该服务
    command: "python"
    args: ['{repo}\Plugins\UnrealMCP\Python\unreal_mcp_server_advanced.py']
    cwd: '{repo}\Plugins\UnrealMCP\Python'
    env: {}
    disabled_tools: [execute_python]
    read_only_tools:
      - ping
      - get_actors_in_level
      - find_actors_by_name
      - read_blueprint_content
      - analyze_blueprint_graph
      - get_blueprint_variable_details
      - get_blueprint_function_details
      - get_available_materials
      - ue_list_data_tables
      - ue_describe_data_table
      - ue_read_data_table
      - ue_search_data_tables
      - validate_asset_path
      - batch_validate_asset_paths
      - find_spawner_actors
      - find_npc_actors
      - get_actor_transform
      - get_selected_actors_transform
      - get_current_level_info
      - get_viewport_camera
      - preview_editops
      - editop_health
      - list_docs
      - read_doc
      - describe_scheme
      - run_data_check
      - get_current_editor_context
      - describe_template
      - describe_entity
      - outline_doc
      - find_nodes
      - read_subtree
    automates_manual_keywords: [蓝图, actor, datatable, uasset, umap, 场景资源, 关卡资源]
    startup_timeout_sec: 20
    tool_timeout_sec: 60

  prefab_mcp2:
    enabled: false
    command: "python"
    args: [-m, prefab_mcp2.server]
    cwd: '{repo}\Plugins\UnrealMCP\Python\prefab_mcp2'
    env:
      PYTHONPATH: '{repo}\Plugins\UnrealMCP\Python\prefab_mcp2\src'
    read_only_tools:
      - lgui_ping
      - lgui_asset_list
      - lgui_asset_classmap
      - lgui_checkpoint_list
      - lgui_checkpoint_get
      - lgui_diff
      - lgui_get_code_root
      - lgui_session_open
      - lgui_session_close
      - lgui_session_list
      - lgui_session_discard
      - lgui_node_tree
      - lgui_node_info
      - lgui_node_find
      - lgui_node_rect
      - lgui_node_pick_at
      - lgui_prop_list
      - lgui_prop_get
      - lgui_node_screenshot
      - lgui_node_screenshot_marked
      - lgui_registry_get
    automates_manual_keywords: [prefab, 预制体, lgui]
    startup_timeout_sec: 20
    tool_timeout_sec: 60
quality:
  require_verification: true        # 无验证命令时只能生成 candidate，不能标记 verified
  max_changed_files: 8
  max_diff_lines: 500
  admission:
    min_score: 55
    require_reproduction_signal: true
    manual_keywords: []                 # 通用资源门禁由各 MCP 的 automates_manual_keywords 声明

review:
  enabled: true                     # 独立只读 Reviewer；high/medium finding 必须修正
  max_fix_rounds: 1                 # Reviewer 拒绝后最多定向修正一轮
  # 评审模型不在这里配置（旧的 review.model 已移除、不再生效）：
  # 需要 Reviewer 用独立模型时，只配下面的 agents.roles.review.model。

# 显式角色层（可选段）。Orchestrator（worker 状态机）负责状态机 / 派发 / 验收，
# 角色只决定「这一次调用用哪个模型、给多长时限」，不改变阶段顺序、phase 取值、
# 错误类型与 P4/Git 流程。整段省略 = 与旧配置行为完全一致（这是默认形态）。
# 角色 -> 阶段（audit 里 role 与 phase 是两个字段，phase 取值保持不变）：
#   investigation  只读调查（含补充核查、范围复核）        phase: investigation
#   implementation 首轮实施写入                            phase: implementation
#   review         独立只读评审（含修正后的二次评审）       phase: review
#   recovery       无工具收尾 / 预算收尾 / Reviewer 修正    phase: investigation | implementation | correction
#   coordinator    调查前计划建议 + 交付前最终汇总           phase: coordinator_plan | coordinator_summary
#                  （只读无工具，只产出文字，不参与任何决策；失败降级，人工取消向上传播）
# 别名：investigator / implementer / reviewer 自动归一到规范角色名。
# 只在编排器侧生效；每次 Pi 调用仍是独立上下文，两层编排（Orchestrator -> Pi 子进程）无递归。
agents:
  roles:
    # investigation —— 只读调查（补充核查、范围复核复用同一角色）
    #   职责：定位根因与证据、给出最小修改范围与 planned_files，不写代码。
    #   权限/工具：sandbox 只读，工具白名单 read / grep / find / ls；可挂只读 MCP（诊断页、资源查询）。
    #   典型调用点：主调查（audit phase = investigation）、超时或缺证据时的补充核查、实施前的范围复核。
    #   model 留空：沿用 pi.provider 的模型；填裸模型名会自动补 provider 前缀（下同）。
    #   timeout_s：该角色各调用点的单次时限（秒）；注释掉不写 = 沿用 agent_timeout_s 与原有阶段预算。
    investigation:
      model: ""                    # 空 = 沿用 pi.provider 的模型；也可只写裸模型名（自动补 provider 前缀）
      # timeout_s: 1800            # 单次调用时限（秒）；不写则沿用 agent_timeout_s

    # implementation —— 首轮实施写入
    #   职责：按调查计划的 planned_files 做最小修复并跑最小相关验证，不重新全量调查。
    #   权限/工具：sandbox workspace-write（必须真实落笔）；project 文件由编排器预打开，新建文件由编排器 p4 add。
    #   典型调用点：编码阶段首次调用（audit phase = implementation）。
    #   model 留空：沿用 pi.provider 的模型。
    #   timeout_s：首轮实施的单次时限；不写 = 沿用 agent_timeout_s。
    #              上面示例值 2400 只是"给大仓库留余量"的写法，会真实生效，请按需填写。
    implementation:
      model: ""
      # timeout_s: 2400

    # review —— 独立只读评审
    #   职责：核对真实 diff、验收证据与复用情况，给出 findings 与 approved；只读，不直接改代码。
    #   权限/工具：sandbox 只读，工具白名单 read / grep / find / ls。
    #   典型调用点：候选产出后的评审与修正后的二次评审（audit phase = review）。
    #   model：评审模型的唯一入口（旧的 review.model 已移除）；不配 = pi.provider 默认模型，
    #          需要 Reviewer 用独立模型时只在这里配。
    #   timeout_s：单次评审时限；不写 = 沿用 agent_timeout_s。
    review:
      model: ""                    # 评审模型的唯一入口：不配 = pi.provider 默认模型；
                                   # 也可只写裸模型名（自动补 provider 前缀）
      # timeout_s: 1200

    # recovery —— 恢复/修正（一个角色覆盖三类补救调用）
    #   1) 无工具收尾：调查超时后仅凭已有轨迹整理产出（tools 置空，每轮最多一次）；
    #   2) 预算恢复：编码达预算且无真实改动时做定向收尾，要求立即落笔；
    #   3) Reviewer 定向修正：评审被拒后按 findings 修正，以及该修正未落笔时的再次收尾。
    #   权限/工具：跟随被接管阶段——收尾类无工具，编码/修正类 workspace-write；P4/Git 仍由编排器执行。
    #   model 留空：沿用 pi.provider 的模型。
    #   timeout_s：三类调用预算规则不同，因此这里故意不配置，以保留各自的派生预算：
    #              收尾类默认 = min(agent_timeout_s, max(180, agent_timeout_s/3))（1800 → 600），
    #              而 Reviewer 定向修正按 agent_timeout_s 起算（1800）；
    #              显式填写会让修正类直接用该值，等于收紧修正预算，故保持留空。
    recovery:
      model: ""
      # timeout_s: 600             # 故意留空：收尾走派生上限，定向修正仍用 agent_timeout_s 起算

    # coordinator —— 计划建议 + 最终汇总（唯一不参与决策的角色）
    #   **可选**：只在配置里出现本条、且解析出至少一个有效字段（model 或 timeout_s）时才启用
    #            （它是新增调用点，会在既有调用序列里插入两次只读调用）；
    #            删掉/注释掉整条 = 调用序列与改造前逐字一致，不产生任何额外模型调用。
    #            注意：`coordinator: {}` 这种没有任何有效字段的写法会按既有规则被丢弃，
    #            要启用请至少写上 model:（留空 = 沿用 pi.provider 默认模型）。
    #   职责：只在两处被调用——① 主调查之前给出「调查计划建议」；② 最终交付之前把已确定的事实
    #         整理成一段交付说明。两者都只是附加文字，不推进阶段、不决定文件白名单、不做 P4/Git。
    #   权限/工具：sandbox 只读且 tools 置空（tools: []），不挂任何 MCP，也拿不到仓库内容。
    #   失败降级：超时 / 异常退出 / 输出不是严格 JSON（只接受 FINAL_RESULT: 后或整段输出的单个
    #             JSON 对象）/ 字段类型不符 → 记一条 warn 事件后按原流程继续，绝不影响任务结论。
    #             唯一例外是人工取消：原样向上传播，整单终止并回到待处理队列。
    #   交付边界：汇总以「协调者补充说明（未参与任何决策，不覆盖上述测试/文件/评审事实）」的附加
    #             段落追加在交付描述末尾；result.summary、改动清单、验证结论、交付分类都不会被改写。
    #   model 留空：沿用 pi.provider 的模型。
    #   timeout_s：只收紧不放宽——计划调用取 min(它, 120s)、汇总调用取 min(它, 90s)；
    #              不写则直接用这两个派生上限（协调者只是建议，不值得占用正式阶段的预算）。
    coordinator:
      model: ""
      # timeout_s: 120             # 不写 = 计划 120s / 汇总 90s（派生上限），写了只会更短

# 过滤条件
filters:
  exclude_status: [resolved, closed, rejected]   # 不处理这些 Tapd 状态

# 优先级 -> 排序权重（数字越小越优先；未匹配到的排最后）
priority_weight:
  "1": 0
  "2": 1
  "3": 2
  "4": 3
  "高": 0
  "中": 1
  "低": 2

# 工作区（Tapd 项目）配置，可多个
workspaces:
  - workspace_id: "1123456780"      # Tapd workspace_id（用 API 返回的为准）
    owner: "your_tapd_login"        # 你的 Tapd 登录名，用于 current_owner 过滤"分配给我的"
    default_repo: "product"          # 默认仓库名（无法按模块匹配时使用）
    repos:                           # bug 所属仓库的本地路径（p4 workspace root）
      - name: "product"
        path: "C:\\repos\\product"   # 该目录需已配置好 p4 client 映射
        ignore_paths:                  # 可选：P4 中也不参与脏检查/reconcile/changelist 的本地生成目录
          - "Saved/"
          - "Binaries/"
        preflight_reconcile: never     # 推荐：不做全目录扫描；修复后仅对调查阶段 planned_files 做 reconcile 兜底
        # 配置只写在本工具 config.yaml；不向目标项目添加 Agent 配置或改写已有测试。
        # 直接复用项目原生测试工程。cwd 相对上述 repo.path，也支持用户指定的绝对路径。
        # tests 仅为示例名称，可以是 test、qa、独立测试工程等任意现有目录。
        verify_cmds:                  # 按顺序执行；任一失败即停止；命令应运行一次后退出
          - command: "npm run typecheck"
            cwd: "."
            timeout_sec: 600
          - command: "npm test -- --run"
            cwd: "tests"             # 有独立 package.json 的测试工程；否则用 . 并传目录参数
            timeout_sec: 600
        # 其它框架示例（按项目选用）：pytest tests；dotnet test tests/Product.Tests.csproj。
        # 可选补充：本工具协议的 .mjs 专项测试；普通 tests 目录请使用上面的原生命令。
        # 每次修复前递归发现目录内 .mjs；脚本 export const files 声明适用源码。
        # directory 由用户指定：绝对路径、相对本 config 文件，或 '{repo}/qa/agent-suites'。
        # 内置脚本针对 示例项目；其它项目请换为自己的测试目录后启用。
        behavior_checks:
          enabled: false
          directory: behavior-suites
          disabled: []                 # 临时停用示例：[map-tiles]；子目录示例：[map/tiles]
          timeout_sec: 30
        # 可选：同一个 Bug 允许同时修改多个附加 Git 仓库。Pi 通过提示词中的
        # 根别名和绝对路径访问这些目录；无需配置 skill 目录。
        additional_dirs:
          - name: "engine"            # 稳定根别名；Agent 输出形如 engine:Engine/Source/Foo.cpp
            path: "C:\\repos\\engine" # 必须是 Git 仓库根目录，且开始处理前工作树必须干净
            vcs: git
            base_branch: "branch_0.7.0"
            author: "developer"         # 空值时回退 p4.user，再回退 workspace.owner
            ignore_paths:             # 相对 Git 根目录；可含 glob，目录以 / 结尾
              - "Engine/Binaries/Win64/UnrealBuildAccelerator/"
            verify_cmds:
              - "cmake --build build --config Development"

# Perforce（环境变量 P4PORT/P4CLIENT/P4USER/P4PASSWD 优先级更高，也可直接填这里）
p4:
  port: ssl:perforce.example.com:1666
  client: tapd-agent_yourname
  user: your_p4_user
  password: ""

# Web 管理台
web:
  host: 127.0.0.1
  port: 8080
  token: ""                # 留空则本机免鉴权；建议设置一个，管理页需带 token

# Tapd 后端
#   mcp  - 通过 Tapd MCP Server 接入（推荐）：只需个人访问令牌 TAPD_ACCESS_TOKEN
#   rest - 直接用 Tapd OpenAPI（api_user/api_password，需 API 账号权限）
tapd:
  backend: mcp
  access_token: ""        # 个人访问令牌（Tapd 个人设置 -> 个人访问令牌 创建）
  mcp:
    transport: stdio
    command: "npx"
    # npm install 后使用项目本地固定版本，禁止运行时联网下载。
    args: ["--no-install", "@xihe-lab/tapd-mcp-server"]
    # 远程托管模式可改为：transport: streamable-http / url: "https://..." / token: ""
    tool_map:
      list_bugs: "tapd_get_bugs"
      get_bug: "tapd_get_bugs"
      update_bug: "tapd_update_bug"
      add_comment: "tapd_create_comment"
  api_user: ""
  api_password: ""
