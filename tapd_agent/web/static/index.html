<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapdBugFixAgent 管理台</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d24; --panel2: #1e2731; --border: #2a3440;
    --text: #d8e1ea; --muted: #8b98a5; --accent: #3b82f6; --accent2: #2563eb;
    --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --blue: #38bdf8; --gray: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.running { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.paused { background: rgba(245,158,11,.15); color: var(--amber); }
  .badge.stopped { background: rgba(107,114,128,.15); color: var(--gray); }
  .badge.failed { background: rgba(239,68,68,.15); color: var(--red); }
  .badge.resolved { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.partial { background: rgba(245,158,11,.15); color: var(--amber); }
  .badge.manual_only { background: rgba(56,189,248,.15); color: var(--blue); }
  .badge.in_progress, .badge.pending { background: rgba(59,130,246,.15); color: var(--blue); }
  .badge.unprocessed { background: rgba(148,163,184,.18); color: var(--muted); }
  .badge.skipped { background: rgba(107,114,128,.15); color: var(--gray); }
  button { background: var(--accent2); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.danger { background: var(--red); }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
  .stat b { color: var(--text); }
  main { display: grid; grid-template-columns: 1fr 420px; gap: 16px; padding: 16px 20px; height: calc(100vh - 58px); }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  select, input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  input[type=text] { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  tr { cursor: pointer; }
  tr:hover td { background: var(--panel2); }
  .list-scroll { overflow-y: auto; min-height: 0; flex: 1; border-radius: 10px; border: 1px solid var(--border); }
  .detail-scroll { overflow-y: auto; min-height: 0; flex: 1; }
  h3 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; margin-bottom: 10px; }
  .kv dt { color: var(--muted); }
  .kv dd { word-break: break-all; }
  .section { margin-bottom: 14px; }
  .section h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  pre { background: #0b0f14; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; }
  ul { list-style: none; font-size: 13px; }
  ul li { padding: 3px 0; word-break: break-all; }
  .reason { color: var(--amber); }
  .events { font-size: 12px; color: var(--muted); }
  .events li { padding: 2px 0; border-bottom: 1px dashed var(--border); }
  .progress { font-size: 12px; color: var(--muted); max-height: 200px; overflow-y: auto; list-style: none; padding: 0; }
  .progress li { padding: 2px 0; border-bottom: 1px dashed var(--border); font-family: Consolas, "Courier New", monospace; }
  .now-line { font-size: 13px; color: var(--blue); font-weight: 600; margin: 4px 0 6px; word-break: break-all; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .actions { display: flex; gap: 8px; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🛠 TapdBugFixAgent</h1>
  <span id="controlBadge" class="badge stopped">stopped</span>
  <span id="currentBug" class="stat" style="margin-left:0">当前: -</span>
  <div class="stats">
    <span class="stat">待处理 <b id="stQueued">0</b></span>
    <span class="stat">已解决 <b id="stResolved">0</b></span>
    <span class="stat">部分完成 <b id="stPartial">0</b></span>
    <span class="stat">资源待人工 <b id="stManual">0</b></span>
    <span class="stat">失败 <b id="stFailed">0</b></span>
  </div>
  <div class="actions">
    <button id="btnStart" data-act="start">▶ 开启</button>
    <button id="btnPause" data-act="pause" class="ghost">⏸ 暂停</button>
    <button id="btnResume" data-act="resume" class="ghost">⏯ 恢复</button>
    <button id="btnStop" data-act="stop" class="danger">⏹ 关闭</button>
  </div>
</header>

<main>
  <div class="col">
    <div class="card toolbar">
      <select id="fState">
        <option value="all">全部状态</option>
        <option value="unprocessed">未处理</option>
        <option value="pending">待处理</option>
        <option value="in_progress">处理中</option>
        <option value="resolved">已解决</option>
        <option value="partial">部分完成</option>
        <option value="manual_only">资源待人工</option>
        <option value="failed">失败</option>
        <option value="skipped">跳过</option>
      </select>
      <input type="text" id="fSearch" placeholder="搜索 bug id / 标题…">
      <button id="btnRefresh" class="ghost">刷新</button>
    </div>
    <div class="list-scroll">
      <table>
        <thead><tr>
          <th>Bug ID</th><th>标题</th><th>优先级</th><th>状态</th><th title="Agent 生成的 Perforce pending changelist 编号">CL#</th><th>Agent</th><th>完成时间</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="listEmpty" class="empty">暂无记录</div>
    </div>
  </div>

  <div class="col">
    <div class="card" style="flex:0 0 auto">
      <h3>Bug 详情</h3>
      <div id="detailEmpty" class="empty" style="padding:12px 0">点击列表行查看详情</div>
    </div>
    <div class="card detail-scroll" id="detailCard" style="display:none">
      <div id="detailBody"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('tapd_token') || '';
let SNAPSHOT = { status: { control:'stopped', counts:{} }, items: [] };
let SELECTED_ID = null;

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return h;
}
async function api(path, method='GET', body) {
  const opts = { method, headers: authHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (r.status === 401) { alert('未授权：token 不正确'); return null; }
  if (!r.ok) { const t = await r.text().catch(()=>''); console.error(path, r.status, t); return null; }
  return r.json();
}

// ---------- 渲染 ----------
const STATE_LABEL = { pending:'待处理', in_progress:'处理中', resolved:'已解决', partial:'部分完成', manual_only:'资源待人工', failed:'失败', skipped:'跳过' };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(t) { return t ? t.slice(5, 16) : '-'; }

function progressHTML(job) {
  const prog = job.progress || [];
  if (!prog.length) {
    const busy = job.agent_state === 'in_progress' || job.agent_state === 'pending';
    return `<div class="section"><h4>处理进度</h4><div class="muted">${busy ? 'Agent 正在运行，尚无进度输出…' : '(无进度记录)'}</div></div>`;
  }
  const now = prog[0];               // list_events 按 id DESC：最新一条在最前
  const rest = prog.slice(1, 60);
  const spinning = job.agent_state === 'in_progress';
  return `<div class="section">
    <h4>处理进度 <span class="muted" style="text-transform:none">· 共 ${prog.length} 条</span></h4>
    <div class="now-line">${spinning ? '<span class="spin">⟳</span> ' : '▸ '}${escapeHtml(now.msg)}</div>
    <ul class="progress">${rest.map(e => `<li>${escapeHtml(String(e.ts||'').slice(11,19))} ${escapeHtml(e.msg)}</li>`).join('')}</ul>
  </div>`;
}

function renderStatus() {
  const st = SNAPSHOT.status || {};
  const c = st.control || 'stopped';
  const badge = $('controlBadge');
  badge.textContent = c;
  badge.className = 'badge ' + c;
  $('currentBug').textContent = '当前: ' + (st.current_bug ?? '-');
  const counts = st.counts || {};
  $('stQueued').textContent = (counts.pending||0) + (counts.in_progress||0);
  $('stResolved').textContent = counts.resolved||0;
  $('stPartial').textContent = counts.partial||0;
  $('stManual').textContent = counts.manual_only||0;
  $('stFailed').textContent = counts.failed||0;
  const running = c === 'running';
  $('btnStart').disabled = running;
  $('btnPause').disabled = !running;
  $('btnResume').disabled = running;
  $('btnStop').disabled = !running;
}

function filtered() {
  const state = $('fState').value;
  const q = $('fSearch').value.trim().toLowerCase();
  return (SNAPSHOT.items || []).filter(it => {
    if (state !== 'all') {
      if (state === 'unprocessed') { if (it.agent_state) return false; }
      else if (it.agent_state !== state) return false;
    }
    if (q && !(String(it.bug_id).includes(q) || String(it.title||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderTable() {
  const items = filtered();
  const tbody = $('tbody');
  tbody.innerHTML = '';
  $('listEmpty').style.display = items.length ? 'none' : '';
  for (const it of items) {
    const tr = document.createElement('tr');
    tr.dataset.id = String(it.bug_id);   // bug_id 是字符串（后端已保证），大整数不丢精度
    if (String(it.bug_id) === SELECTED_ID) tr.style.background = 'var(--panel2)';
    tr.innerHTML = `
      <td class="mono">${it.bug_id}</td>
      <td>${escapeHtml(it.title)}</td>
      <td>${escapeHtml(it.priority_label || it.priority || '-')}</td>
      <td><span class="badge ${it.agent_state || 'unprocessed'}">${it.agent_state ? (STATE_LABEL[it.agent_state] || it.agent_state) : '未处理'}</span></td>
      <td class="mono">${it.changelist ?? '-'}</td>
      <td>${escapeHtml(it.agent || '-')}${it.model ? `<span class="muted"> · ${escapeHtml(it.model)}</span>` : ''}</td>
      <td>${fmtTime(it.finished_at)}</td>`;
    tr.onclick = () => selectBug(String(it.bug_id));
    tbody.appendChild(tr);
  }
}

function renderDetail(job) {
  SELECTED_ID = String(job.bug_id);
  $('detailEmpty').style.display = 'none';
  $('detailCard').style.display = '';
  const assets = JSON.parse(job.manual_assets || '[]');
  const files = JSON.parse(job.files || '[]');
  const html = `
    <div class="kv">
      <dt>Bug ID</dt><dd class="mono">${job.bug_id}</dd>
      <dt>标题</dt><dd>${escapeHtml(job.title)}</dd>
      <dt>状态</dt><dd><span class="badge ${job.agent_state || 'unprocessed'}">${job.agent_state ? (STATE_LABEL[job.agent_state] || job.agent_state) : '未处理'}</span></dd>
      <dt>优先级</dt><dd>${escapeHtml(job.priority_label || job.priority || '-')}</dd>
      <dt>Changelist</dt><dd class="mono">${job.changelist ?? '-'}</dd>
      <dt>Agent</dt><dd>${escapeHtml(job.agent || '-')}</dd>
      <dt>模型</dt><dd>${job.model ? escapeHtml(job.model) : '<span class="muted">(CLI 默认)</span>'}</dd>
      <dt>Tapd 状态</dt><dd>${escapeHtml(job.tapd_status || '-')}</dd>
      <dt>Tapd 链接</dt><dd><a href="${escapeHtml(job.url || '')}" target="_blank" rel="noopener">在 Tapd 打开 ↗</a></dd>
      <dt>开始/完成</dt><dd>${escapeHtml(job.started_at || '-')} → ${escapeHtml(job.finished_at || '-')}</dd>
      ${job.failure_reason ? `<dt class="reason">失败原因</dt><dd class="reason">${escapeHtml(job.failure_reason)}</dd>` : ''}
    </div>
    ${progressHTML(job)}
    ${job.description ? `<div class="section">
      <h4>Tapd 原始描述</h4>
      <pre>${escapeHtml(job.description)}</pre>
    </div>` : ''}
    <div class="section">
      <h4>生成的 pending 描述</h4>
      <pre>${escapeHtml(job.generated_description || '(未生成)')}</pre>
    </div>
    <div class="section">
      <h4>修改文件</h4>
      <ul>${files.length ? files.map(f => `<li class="mono">${escapeHtml(f)}</li>`).join('') : '<li class="muted">(无代码改动)</li>'}</ul>
    </div>
    <div class="section">
      <h4>需人工处理的资源</h4>
      <ul>${assets.length ? assets.map(a => `<li class="mono">${escapeHtml(a.path)} <span class="reason">— ${escapeHtml(a.reason || '')}</span></li>`).join('') : '<li class="muted">(无)</li>'}</ul>
    </div>
    ${job.has_local ? `<div class="section">
      <h4>操作</h4>
      <div class="actions">
        <button onclick="actRetry(${job.bug_id})">↻ 重试</button>
        <button class="ghost" onclick="actSkip(${job.bug_id})">⏭ 跳过</button>
      </div>
    </div>` : `<div class="section">
      <h4>操作</h4>
      <div class="actions">
        <button class="ghost" onclick="actSkip(${job.bug_id})">⏭ 跳过（不处理）</button>
      </div>
    </div>`}
    <div class="section">
      <h4>操作日志</h4>
      <ul class="events">${(job.events || []).map(e => `<li>${escapeHtml(e.ts)} [${escapeHtml(e.level)}] ${escapeHtml(e.msg)}</li>`).join('') || '<li>无</li>'}</ul>
    </div>`;
  $('detailBody').innerHTML = html;
  renderTable();
}

async function selectBug(id) {
  const job = await api('/api/bugs/' + id);
  if (job) renderDetail(job);
}

// ---------- 操作 ----------
document.querySelectorAll('header button[data-act]').forEach(btn => {
  btn.onclick = async () => {
    const r = await api('/api/control', 'POST', { action: btn.dataset.act });
    if (r) renderStatus();
  };
});
$('btnRefresh').onclick = refresh;
$('fSearch').oninput = renderTable;
$('fState').onchange = renderTable;

async function actRetry(id) { await api('/api/bugs/' + id + '/retry', 'POST', {}); refresh(); selectBug(id); }
async function actSkip(id) { await api('/api/bugs/' + id + '/skip', 'POST', {}); refresh(); selectBug(id); }

async function refresh() {
  const st = await api('/api/status');
  if (st) { SNAPSHOT.status = st; renderStatus(); }
  const list = await api('/api/bugs');
  if (list) { SNAPSHOT.items = list.items; renderTable(); }
  if (SELECTED_ID) { const j = await api('/api/bugs/' + SELECTED_ID); if (j) renderDetail(j); }
}

// ---------- SSE 实时刷新 ----------
function connectSSE() {
  const es = new EventSource('/api/events' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : ''));
  es.addEventListener('snapshot', e => {
    try {
      const data = JSON.parse(e.data);
      SNAPSHOT.status = data.status;
      SNAPSHOT.items = data.items;
      renderStatus();
      renderTable();
      // 实时刷新选中 bug 详情（含 Agent 进度事件）
      if (SELECTED_ID) {
        api('/api/bugs/' + SELECTED_ID).then(j => { if (j) renderDetail(j); });
      }
    } catch (err) { console.error(err); }
  });
  es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}

refresh();
connectSSE();
</script>
</body>
</html>
